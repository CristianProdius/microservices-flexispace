server {
    listen 80;
    server_name spacefly.ai;

    # H3: keep ACME HTTP-01 challenge reachable over :80 so certbot renewals
    # (webroot mode) still work; everything else is redirected to HTTPS below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # H3: force all plaintext traffic to HTTPS instead of proxying over :80.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name spacefly.ai;

    ssl_certificate /etc/letsencrypt/live/spacefly.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spacefly.ai/privkey.pem;

    # H3: enforce HTTPS on future visits (2 years, includes subdomains).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

